<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세트 목록 시트 · 물품 정보/묶음 정보 보내기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#17191c}.phone{width:390px;height:844px;background:#f5f6f8;position:relative;overflow:hidden}.status{height:44px;padding:14px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.under{padding:14px 16px}.bar{display:flex;align-items:center;gap:10px;background:white;border:1px solid #e9ebee;border-radius:16px;padding:10px 12px}.thumb{width:44px;height:44px;border-radius:10px;background:#ffd5ba;flex:none}.barInfo{flex:1;min-width:0}.barStatus{font-size:11px;font-weight:800;color:#676c73}.barTitle{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barTotal{font-size:13px;font-weight:800}.shade{position:absolute;inset:0;background:rgba(15,18,22,.42)}.sheet{position:absolute;left:0;right:0;bottom:0;background:white;border-radius:22px 22px 0 0;padding:10px 20px 0;display:flex;flex-direction:column}.handle{width:42px;height:4px;border-radius:4px;background:#d5d7da;margin:0 auto 14px}.title{font-size:17px;font-weight:800;margin-bottom:8px}.list{max-height:330px;overflow:hidden}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eceef1}.rowThumb{width:52px;height:52px;border-radius:10px;flex:none}.rowThumb.a{background:#ffd5ba}.rowThumb.b{background:#c9e6d8}.rowInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.rowTitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowPrice{font-size:13px;font-weight:800}.rowBadge{font-size:11px;font-weight:700;color:#676c73}.rowBadge.reserved{color:#bd560c}.sendBtn{flex:none;border:0;border-radius:10px;background:#f1f2f4;color:#3c4147;font-size:12px;font-weight:700;padding:8px 10px;white-space:nowrap}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 24px}.summary{font-size:13px;font-weight:700;color:#676c73}.footerActions{display:flex;gap:8px}.editBtn{border:0;border-radius:12px;background:#f1f2f4;color:#3c4147;font-size:13px;font-weight:800;padding:10px 14px}.bundleBtn{border:0;border-radius:12px;background:#ff7a1a;color:white;font-size:13px;font-weight:800;padding:10px 16px}
</style>
</head>
<body><div class="phone">
  <div class="status"><span>14:32</span><span>5G&nbsp;&nbsp;92%</span></div>
  <div class="under">
    <div class="bar"><span class="thumb"></span><div class="barInfo"><span class="barStatus">판매중 ⌄</span><span class="barTitle">Honda Vision 2021 헬멧 세트 외 1</span></div><span class="barTotal">3.100.000 đ</span></div>
  </div>
  <div class="shade"></div>
  <section class="sheet">
    <div class="handle"></div>
    <div class="title">Minh Tuấn님과 한 번에 거래하는 물품이에요</div>
    <div class="list">
      <div class="row"><span class="rowThumb a"></span><div class="rowInfo"><span class="rowTitle">Honda Vision 2021</span><span class="rowPrice">3.000.000 đ</span><span class="rowBadge">판매중</span></div><button class="sendBtn" type="button">물품 정보 보내기</button></div>
      <div class="row"><span class="rowThumb b"></span><div class="rowInfo"><span class="rowTitle">오토바이 헬멧</span><span class="rowPrice">100.000 đ</span><span class="rowBadge reserved">예약중</span></div><button class="sendBtn" type="button">물품 정보 보내기</button></div>
    </div>
    <div class="footer"><span class="summary">2개 · 총 3.100.000 đ</span><div class="footerActions"><button class="editBtn" type="button">물품편집</button><button class="bundleBtn" type="button">묶음 정보 보내기</button></div></div>
  </section>
</div></body></html>
