name: CI

on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치의 새 push/PR 업데이트가 오면 이전 실행은 취소 — Actions 분 절약
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-scripts:
    name: pre-commit 가드 스크립트 (seed-safety / migration-prefix / committed-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_production_seed_safety.py
      - run: python3 tools/check_migration_prefixes.py
      - run: python3 tools/check_committed_secrets.py

  backend-tests:
    name: backend pytest
    runs-on: ubuntu-latest
    env:
      # CI 전용 더미 값 — 실제 시크릿 아님. ADMIN_JWT_SECRET 미설정 시
      # backend/app/admin_auth.py 가 import 단계에서 RuntimeError 를 던진다.
      ADMIN_JWT_SECRET: ci-dummy-admin-jwt-secret
      ADMIN_PASS_HASH: ci-dummy-admin-pass-hash
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-mock
      - working-directory: backend
        run: python -m pytest app/tests -q

  engine-tests:
    name: engine pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - working-directory: engine
        run: pip install -r requirements.txt -r requirements-dev.txt
      # engine/app/tests/conftest.py 가 DATABASE_URL·ENGINE_SERVICE_KEY·
      # ENGINE_ADMIN_JWT_SECRET 을 os.environ.setdefault 로 자체 주입 — CI 에서
      # 추가 env 불필요.
      - working-directory: engine
        run: python -m pytest app/tests -q

  frontend-checks:
    name: frontend tsc / eslint / mjs contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc -b
      - working-directory: frontend
        run: npx eslint src/
      - working-directory: frontend
        run: node --test $(find src -name "*.test.mjs")

  # E2E (Playwright): PR 에서만 돈다 — 스택 빌드(bff 의 playwright chromium 설치 포함)가
  # 무거워 매 push(main 머지)까지 다시 돌리면 Actions 분 낭비가 크다. main 머지는 이미 PR 에서
  # 통과한 커밋이라 재검증 가치가 낮다.
  e2e:
    name: playwright e2e (전체 스택)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    steps:
      - uses: actions/checkout@v4
      # 실제 시크릿 아님 — .env.example 의 placeholder 값 그대로 사용(레포에 .env 가 없어 CI 전용 발급).
      # OTP_DEV_BYPASS: market-edit/market-search 스펙이 판매자 휴대폰 인증을 dev-only 우회 경로로
      # 통과해야 한다(backend/app/routers/auth.py `_otp_bypass_enabled`).
      # DB_USER=wellconn: frontend/e2e/helpers.ts 의 cleanupUser() 가 `psql -U wellconn` 을 하드코딩한다
      # (.env.example 기본값은 saigon 이라 그대로 두면 role 불일치로 매 테스트 afterEach 가 깨진다).
      - name: CI 전용 .env 생성
        run: |
          cp .env.example .env
          echo "OTP_DEV_BYPASS=true" >> .env
          sed -i 's/^DB_USER=.*/DB_USER=wellconn/' .env
      # bff 대상 기동만으로 database/bff_migrate/engine 이 depends_on 체인으로 함께 뜨고,
      # nginx 대상 기동으로 frontend/imgproxy 가 함께 뜬다 — admin_frontend/worker/noti_worker/
      # mcp_dev/wiki 는 이 둘의 의존 그래프에 없어 E2E 3종(동의 게이트·매물 수정·마켓 검색)에 불필요.
      - name: 스택 기동
        run: docker compose --profile backend --env-file .env up -d --build bff nginx
      - name: 헬스체크 대기 (nginx 경유 bff /api/bff/ready)
        run: timeout 180 bash -c 'until curl -sf http://localhost:18090/api/bff/ready > /dev/null; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - name: 스택 정리
        if: always()
        run: docker compose --profile backend --env-file .env down -v
