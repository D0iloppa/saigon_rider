# =============================================================
# Saigon Rider — 운영(prod) override
# dev docker-compose.yml 위에 덧씌워 운영 구조 차이만 반영한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env --profile backend up --build -d
#
# 이 파일은 "구조 변경"만 담는다 (포트 비노출 / 소스 bind-mount 제거 / mcp_dev 제외).
# 도메인·시크릿 등 "값"은 운영 .env 가 담당한다.
#
# 주의: docker compose 는 override 시 ports/volumes/profiles 같은 리스트를
#       기본값에 "병합(append)"한다. 그래서 merge 태그를 쓴다 (compose v2.24+):
#         !reset    → 값 비우기 (dev 정의 제거)
#         !override → 값 교체 (dev 정의를 새 값으로 대체, 병합 안 함)
#       값을 새로 넣어야 하는 항목(nginx loopback, bff contents)은 반드시 !override.
#       단순 제거는 !reset.
# =============================================================

services:

  # ── 진입 nginx: 외부 직접접근 차단 → loopback 에만 바인딩 ──
  # 호스트 nginx 만 127.0.0.1:18090 으로 들어온다.
  nginx:
    ports: !override
      - "127.0.0.1:${NGINX_PORT}:80"
    # 개발 전용 마운트(./dev-test) 제거 — /dev-test/, /dev/gps 하네스가 운영에 서빙되지
    # 않게 한다. volumes 는 상속되므로 반드시 !override 로 다시 나열해야 한다
    # (2026-08-06 코드리뷰 지적: 하네스가 app.saigon-rider.com 에 노출되고 있었다).
    volumes: !override
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - ./nginx/pages:/etc/nginx/pages:ro
      - ./landing:/etc/nginx/landing:ro

  # ── frontend: 호스트 포트 미노출 (컨테이너 nginx 경유만) ──
  frontend:
    ports: !reset []

  # ── BFF: 포트 미노출 + 소스 bind-mount 제거(이미지 권위화), contents 데이터만 유지 ──
  bff:
    ports: !reset []
    volumes: !override
      - ./contents:/data
      - ./frontend/src/components/maps/v2/saigon-depth1.json:/service-area/saigon-depth1.json:ro
    # 운영 명시 — SMS __DEV 스텁 차단(키 없으면 fail-loud) + /auth/dev-login 비활성
    environment:
      - APP_ENV=production
      # APP_ENV 오설정 사고에 대비한 2차 방어 — 운영에서는 항상 빈 값으로 강제 고정(OTP 우회 절대 비활성)
      - OTP_DEV_BYPASS=
      # 운영에서는 항상 빈 값으로 강제 고정(dev-login-as 절대 비활성)
      - DEV_HOST=

  # ── Engine: 포트 미노출 + 소스 bind-mount 제거 ──
  engine:
    ports: !reset []
    # 운영 시크릿 파일 — 소스 마운트가 없으므로 ~/secrets 의 파일만 개별 ro 마운트 (agent-guidelines §4 키 파일 보관).
    #   firebase-credentials.json: FCM 일반 푸시 (06-04 "FCM 푸시 미배선" 해소)
    #   apns-key.p8: iOS Live Activity 원격 갱신 (260829 Phase 3)
    volumes: !override
      - /root/secrets/firebase-credentials.json:/app/firebase-credentials.json:ro
      - /root/secrets/apns-key.p8:/app/apns-key.p8:ro

  # ── Worker: 소스 bind-mount 제거 ──
  worker:
    volumes: !reset []

  # ── Database: 포트 절대 미노출 (외부 DB 접근 차단). 데이터 볼륨은 base 유지 ──
  database:
    ports: !reset []
    command: ["postgres", "-c", "app.seed_profile=production"]

  # ── MCP Dev (legacy): 운영 불필요 → backend 프로필에서 떼어내 미기동 ──
  mcp_dev:
    profiles: !override ["legacy"]
