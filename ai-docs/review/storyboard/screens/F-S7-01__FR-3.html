<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>거래 후기 · 현행 별점 모델</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#17191c}.phone{width:390px;height:844px;background:#f5f6f8;position:relative;overflow:hidden}.status{height:44px;padding:14px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.under{padding:18px}.trade{background:white;border:1px solid #e9ebee;border-radius:16px;padding:16px}.trade b{display:block}.trade span{font-size:13px;color:#777}.shade{position:absolute;inset:0;background:rgba(15,18,22,.42)}.sheet{position:absolute;left:0;right:0;bottom:0;background:white;border-radius:22px 22px 0 0;padding:10px 20px 30px}.handle{width:42px;height:4px;border-radius:4px;background:#d5d7da;margin:0 auto 20px}.title{font-size:19px;font-weight:800;margin-bottom:20px}.label{font-size:13px;font-weight:700;color:#676c73;margin:14px 0 8px}.stars{display:flex;justify-content:center;gap:8px;color:#f59e0b;font-size:39px;line-height:1}.starText{text-align:center;color:#f59e0b;font-size:14px;font-weight:800;margin-top:8px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{border:1px solid #dfe2e6;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;background:white}.active{background:#17191c;color:white;border-color:#17191c}.input{height:82px;border:1px solid #dfe2e6;border-radius:12px;padding:12px;color:#999;font-size:13px}.submit{margin-top:22px;height:48px;border-radius:13px;background:#ff7a1a;color:white;display:grid;place-items:center;font-weight:800}.badge{position:absolute;right:18px;top:18px;border-radius:999px;background:#fff4e9;color:#bd560c;padding:5px 9px;font-size:10px;font-weight:800}
</style>
</head>
<body><div class="phone">
  <div class="status"><span>14:32</span><span>5G&nbsp;&nbsp;91%</span></div>
  <div class="under"><div class="trade"><b>Honda Vision 2021 · 거래완료</b><span>Minh Tuấn님과의 거래</span></div></div>
  <div class="shade"></div>
  <section class="sheet"><div class="handle"></div><span class="badge">현재 구현 · ★1~5</span><div class="title">거래 후기 보내기</div>
    <div class="label">별점</div><div class="stars" aria-label="별점 5점">★★★★★</div><div class="starText">최고예요!</div>
    <div class="label">매너 칭찬 (선택)</div><div class="tags"><span class="tag active">시간 약속을 잘 지켜요</span><span class="tag">친절해요</span><span class="tag active">응답이 빨라요</span><span class="tag">물건 상태가 좋아요</span></div>
    <div class="label">후기 (선택)</div><div class="input">거래 경험을 남겨주세요</div><div class="submit">후기 보내기</div>
  </section>
</div></body></html>
