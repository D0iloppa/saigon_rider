# ── Rate limiting (DB-8) — IP 기준, 상태 저장 zone 은 http 컨텍스트에 선언 ──
# 인증/OTP: 브루트포스·SMS 발송비용 남용 방어 (정상 사용자는 분당 수 회면 충분)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
# 일반 API: 정상 앱 트래픽(피드/지도 폴링 등) 여유는 두되 과도한 스크래핑/DoS 방어
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;

    # Docker 내부 DNS resolver (backend / wiki profile 미사용 시에도 nginx 기동 가능)
    # ipv6=off: Docker DNS 의 AAAA 조회 지연으로 인한 간헐적 해석 실패(→502) 방지 (SGR-208)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 업로드 상한 25MB — 무제한(0)은 대용량 POST로 디스크/메모리 소진(DoS) 표면.
    # 모바일 카메라 원본(수 MB)·아바타 업로드에 충분한 여유값 (기본 1MB 는 413 유발이라 상향)
    client_max_body_size 25m;

    # ── 압축 (베트남 회선 대응) ────────────────────────────────
    # nginx:alpine 기본 nginx.conf 는 `#gzip on;` (주석) 이라 켜주지 않으면 무압축으로
    # 나간다. 여기서 압축되는 주 대상은 BFF/Engine 의 JSON 응답 — FastAPI 에는
    # GZipMiddleware 가 없어 진입 nginx 가 유일한 압축 지점이다.
    # 정적 에셋(JS/CSS/폰트)은 frontend 컨테이너 nginx 가 이미 압축해 Content-Encoding 을
    # 달고 오므로 여기서 재압축되지 않는다.
    # gzip_proxied any: 응답이 프록시 업스트림에서 오고, 상위 hop 이 Via 를 붙이는
    #   구성(엣지 게이트웨이)에서도 압축이 꺼지지 않게 한다.
    # text/event-stream 은 의도적으로 제외 — 향후 SSE 도입 시 압축 버퍼링으로 인한
    #   이벤트 지연을 막는다.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── 보안 헤더 (DB-9) — always: 에러 응답(4xx/5xx)에도 적용 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HTTPS 가 아닌 환경(dev)에서는 브라우저가 무시 — 무해
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 보수적 CSP — 지도/이미지/OAuth 등 다수 외부 출처 사용 중이라 script/style/img/connect 는 https: 허용,
    # 프레이밍·object 임베드만 확실히 차단 (엄격한 nonce 기반은 후속 과제)
    # worker-src 'self' blob: — maplibre-gl(경로안내 MapCanvas/OsmMap)은 타일 파싱을 blob URL
    # 워커로 돌린다. 이 디렉티브가 없으면 worker-src 는 script-src 로 폴백하고 거기엔 blob: 이
    # 없어 워커 생성이 차단돼 **지도가 완전히 빈 화면**이 된다(2026-08-05 대표 지적으로 발견 —
    # ETA·거리는 BFF 응답이라 정상 표시돼 "일부만 안 됨"처럼 보였다). blob: 은 우리가 만든
    # 번들 코드만 담기므로 외부 스크립트 유입 경로가 아니다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;

    # Custom error pages
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /etc/nginx/pages;
        internal;
    }

    # Zalo 도메인 소유권 인증 파일
    location = /zalo_verifierIz_Z5PhCOmD7_iORXzDp85l1un-tjpb1C3an.html {
        root /etc/nginx/pages;
    }

    # 개인정보처리방침 — 정적 HTML 직접 서빙 (frontend SPA 보다 우선)
    location /app_privacy/ {
        root /etc/nginx/pages;
        index index.html;
    }

    # 앱 지원(문의) 페이지 — 정적 HTML 직접 서빙
    location /app_support/ {
        root /etc/nginx/pages;
        index index.html;
    }

    # 쿠폰 QR 검증 페이지 — 정적 호스팅 (qr.js 의 API_HOST 는 아직 LSH 백엔드)
    location /app_qr/ {
        root /etc/nginx/pages;
        index index.html;
    }

    # dev-test 디자인 시안 — 프론트엔드 빌드와 무관, 정적 HTML 직접 서빙
    location ^~ /dev-test/.ls/ {
        alias /srv/dev-test/;
        index _none_;
        autoindex on;
        autoindex_format json;
    }
    location /dev-test/ {
        alias /srv/dev-test/;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    # 개발 하네스 — /dev/gps 등. dev-test 와 같은 마운트를 쓴다(운영 compose 에는 이 볼륨이
    # 없어 배포되지 않는다). SPA(location /)보다 먼저 잡히도록 ^~ 로 우선순위를 준다.
    location ^~ /dev/ {
        alias /srv/dev-test/;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    # Frontend — 프로덕션 빌드를 nginx가 정적 서빙
    location / {
        set $frontend_url http://frontend:80;
        proxy_pass $frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 인증/OTP (/api/bff/auth/otp/* → bff:8080/api/auth/otp/*) — 브루트포스·SMS 남용 방어 (DB-8)
    # 더 구체적인 prefix 라 일반 /api/bff/ 보다 우선 매치된다 (longest-prefix).
    location /api/bff/auth/otp/ {
        limit_req zone=auth_limit burst=5 nodelay;
        set $bff_url http://bff:8080;
        rewrite ^/api/bff/(.*) /api/$1 break;
        proxy_pass $bff_url;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 워키토키 이벤트 스트림(SSE) — 일반 BFF 규칙과 요구가 정반대라 별도 location 으로 뺀다.
    # 더 구체적인 prefix 라 아래 /api/bff/ 보다 우선 매치된다(longest-prefix).
    #  - proxy_buffering off: 켜져 있으면 이벤트가 버퍼에 모였다가 한꺼번에 나가 실시간성이 사라진다.
    #  - proxy_read_timeout: 스트림은 유휴가 정상이다. 기본 60s 면 조용한 채널이 1분마다 끊긴다.
    #  - limit_req 제외: 연결이 오래 유지되는 요청이라 초당 요청 제한의 대상이 아니다.
    location ~ ^/api/bff/walkie/channels/[^/]+/events$ {
        set $bff_sse_url http://bff:8080;
        rewrite ^/api/bff/(.*) /api/$1 break;
        proxy_pass $bff_sse_url;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BFF API (/api/bff/* → bff:8080/api/*)
    location /api/bff/ {
        limit_req zone=api_limit burst=40 nodelay;
        set $bff_url http://bff:8080;
        rewrite ^/api/bff/(.*) /api/$1 break;
        proxy_pass $bff_url;
        # connect 만 짧게(fail-fast) — read/send 는 nginx 기본값(60s) 유지해 느린 admin 집계 쿼리 회귀 방지
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SRE Engine API — 공개 노출은 모바일 GPS ingest 단 하나(POST /api/sre/sreMessage,
    # native/android AppConfig.SRE_ENDPOINT · native/ios AppConfig.sreEndpoint)뿐이다.
    # 그 외 Engine 경로(RP 지급·가챠·상점 구매 등 특권/경제 변경, openapi.json, metrics)는
    # BFF→Engine 내부 통신(backend/app/engine_client.py, http://engine:8090 직접 호출, nginx 미경유)
    # 으로만 쓰이며 공개면에 있을 필요가 없다 — allowlist 로 최소화 (P0-1,
    # ai-docs/260731_prelaunch_go_no_go_audit.md §3.1).
    location = /api/sre/sreMessage {
        limit_req zone=api_limit burst=40 nodelay;
        set $engine_url http://engine:8090;
        rewrite ^/api/sre/(.*) /v1/$1 break;
        proxy_pass $engine_url;
        # connect 만 짧게(fail-fast) — read/send 는 nginx 기본값(60s) 유지해 느린 admin 집계 쿼리 회귀 방지
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Service-Key $http_x_service_key;
    }

    # 그 외 /api/sre/* 전부 기본 거부 (openapi.json·metrics·특권/경제 변경 경로 포함)
    location /api/sre/ {
        return 404;
    }

    # MCP Dev Server — REST API (/api/bff/dev/* → mcp_dev, 위키 하위호환)
    location /api/bff/dev/ {
        set $mcp_dev_url http://mcp_dev:8095;
        rewrite ^/api/bff/dev/(.*) /api/dev/$1 break;
        proxy_pass $mcp_dev_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Dev Server — REST API 직접 경로
    location /api/dev/ {
        set $mcp_dev_url http://mcp_dev:8095;
        proxy_pass $mcp_dev_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Dev Server — Streamable HTTP transport (Claude Code 연결)
    location /mcp-dev/ {
        set $mcp_dev_url http://mcp_dev:8095;
        rewrite ^/mcp-dev/(.*) /mcp/$1 break;
        proxy_pass $mcp_dev_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Admin JSON API — BFF (경로 그대로 전달 — bff 라우터 prefix 가 /admin/api)
    location /admin/api/ {
        set $bff_url http://bff:8080;
        proxy_pass $bff_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Legacy Console — BFF가 직접 서빙 (/admin-legacy/static/ 포함)
    location /admin-legacy/ {
        set $bff_url http://bff:8080;
        proxy_pass $bff_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA — admin_frontend 정적 서빙 (신규 관리자 콘솔)
    location /admin/ {
        set $admin_frontend_url http://admin_frontend:80;
        proxy_pass $admin_frontend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin 트레일링 슬래시 리다이렉트
    location = /admin {
        return 301 /admin/;
    }

    # Engine — 내부 Docker 네트워크(172.16/12)에서만 허용, 외부 직접 접근 차단
    location /engine/ {
        allow 172.16.0.0/12;
        deny all;
        set $engine_url http://engine:8090;
        proxy_pass $engine_url/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Service-Key $http_x_service_key;
    }

    # Imgproxy - 이미지 처리
    location /img/ {
        proxy_pass http://imgproxy:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Wiki (Docusaurus) ─────────────────────────────────────
    # Private 섹션: HTTP Basic Auth 적용 (더 구체적인 location이 우선)
    location /wiki/docs/private/ {
        auth_basic "Saigon Rider — Private Docs";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $wiki_url http://wiki:80;
        proxy_pass $wiki_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public 섹션: 인증 없이 접근 가능
    location /wiki/ {
        set $wiki_url http://wiki:80;
        proxy_pass $wiki_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /wiki 트레일링 슬래시 리다이렉트
    location = /wiki {
        return 301 /wiki/;
    }
}
