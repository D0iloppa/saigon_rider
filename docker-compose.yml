networks:
  dev-net:
    driver: bridge
    name: ${NETWORK_BRIDGE}

volumes:
  saigon_db_data:
  saigon_redis_data:

services:

  # ── Nginx (Reverse Proxy) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: saigon_nginx
    ports:
      - "${NGINX_PORT}:80"
      - "${BIZ_LANDING_PORT}:81"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - ./nginx/pages:/etc/nginx/pages:ro
      - ./dev-test:/srv/dev-test:ro
      - ./landing:/etc/nginx/landing:ro
    networks:
      - dev-net
    depends_on:
      - frontend
      - imgproxy
    environment:
      - WIKI_AUTH_USER=${WIKI_AUTH_USER:-admin}
      # 기본값 금지 — .env 누락 시 공개 비밀번호로 조용히 기동되는 사고 방지 (fail-fast)
      - WIKI_AUTH_PASS=${WIKI_AUTH_PASS:?WIKI_AUTH_PASS missing in .env}
    restart: unless-stopped

  # ── Frontend (React + Vite → nginx 정적 서빙) ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saigon_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - dev-net
    restart: unless-stopped

  # ── Admin Frontend (React SPA → nginx 정적 서빙) ──────────
  # 포트 미노출 — 진입 nginx 경유(/admin/)로만 접근 (내부 네트워크 전용)
  admin_frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: saigon_admin_frontend
    networks:
      - dev-net
    restart: unless-stopped

  # ── Imgproxy (Image Processing) ───────────────────────────
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: saigon_imgproxy
    volumes:
      - ./contents:/data:ro
    networks:
      - dev-net
    environment:
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/data
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      - IMGPROXY_MAX_SRC_RESOLUTION=50
      - IMGPROXY_ALLOWED_SOURCES=local://
    restart: unless-stopped

  # ── BFF (FastAPI, 기존 backend → 역할 재정의) ───────────────
  # docker compose --profile backend up
  bff:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saigon_bff
    profiles: [backend]
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./backend:/app
      - ./contents:/data
      - ./frontend/src/components/maps/v2/saigon-depth1.json:/service-area/saigon-depth1.json:ro
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - ENGINE_BASE_URL=http://engine:8090
      # 기본값 금지 — 비어있으면 BFF↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - CONTENTS_BASE_PATH=/data
      - IMGPROXY_BASE_URL=${IMGPROXY_BASE_URL}
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      - BFF_PUBLIC_URL=${BFF_PUBLIC_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      - TZ=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      - ADMIN_USER=${ADMIN_USER:-admin}
      # 기본값 금지 — 비어있으면 root 관리자 비밀번호 검증이 무력화되는 사고 방지 (fail-fast)
      - ADMIN_PASS_HASH=${ADMIN_PASS_HASH:?ADMIN_PASS_HASH missing in .env}
      # 기본값 금지 — 공개 문자열로 admin JWT가 서명되면 위조 가능 (fail-fast)
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET missing in .env}
      - WIKI_BASE_PATH=${WIKI_BASE_PATH:-/wiki/}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - RAINVIEWER_API_KEY=${RAINVIEWER_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - TRANSLATE_API_KEY=${TRANSLATE_API_KEY:-}
      - TRANSLATE_PROVIDER=${TRANSLATE_PROVIDER:-google}
      - SMS_PROVIDER_API_KEY=${SMS_PROVIDER_API_KEY:-}
      # Zalo OAuth 인증 호출을 베트남 IP 프록시로 경유 (-501 우회). 미설정 시 직접 호출. CLAUDE.md '## Zalo 인증 프록시 VPS' 참조.
      - ZALO_API_PROXY=${ZALO_API_PROXY:-}
      # dev/prod 분기 (SMS 스텁·dev-login 노출 제어). prod 는 docker-compose.prod.yml 이 production 으로 고정.
      - APP_ENV=${APP_ENV:-development}
      - OSM_OVERPASS_ENDPOINT=${OSM_OVERPASS_ENDPOINT:-https://overpass-api.de/api/interpreter}
      - WEATHER_CACHE_TTL_CURRENT=${WEATHER_CACHE_TTL_CURRENT:-600}
      - WEATHER_CACHE_TTL_FORECAST_1H=${WEATHER_CACHE_TTL_FORECAST_1H:-1800}
      - WEATHER_CACHE_TTL_FORECAST_24H=${WEATHER_CACHE_TTL_FORECAST_24H:-3600}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_URL=${PLANE_URL:-https://plane.doil.me}
      - PLANE_WORKSPACE=${PLANE_WORKSPACE:-doil}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/ready').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── MCP Dev Server (legacy — Plane으로 대체) ─────────────
  # docker compose --profile legacy up
  mcp_dev:
    build:
      context: ./mcp_dev
      dockerfile: Dockerfile
    container_name: saigon_mcp_dev
    profiles: [backend]
    ports:
      - "${MCP_DEV_PORT:-8095}:8095"
    volumes:
      - ./mcp_dev:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_URL=${PLANE_URL:-https://plane.doil.me}
      - PLANE_WORKSPACE=${PLANE_WORKSPACE:-doil}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID:-}
    restart: unless-stopped

  # ── Engine (SRE, 신규) ────────────────────────────────────
  # docker compose --profile backend up
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: saigon_engine
    profiles: [backend]
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8090 --reload"]
    ports:
      - "${ENGINE_PORT:-8090}:8090"
    volumes:
      - ./engine:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      # 기본값 금지 — 비어있으면 BFF↔Engine / worker↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - ENGINE_ADMIN_JWT_SECRET=${ENGINE_ADMIN_JWT_SECRET:?ENGINE_ADMIN_JWT_SECRET missing in .env}
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-/app/firebase-credentials.json}
      - FCM_PUSH_HISTORY_TTL_DAYS=${FCM_PUSH_HISTORY_TTL_DAYS:-7}
      - SRE_TIMEZONE=Asia/Ho_Chi_Minh
      - SRE_RP_EXPIRY_MONTHS=3
      - SRE_DAILY_CAP_STANDARD=250
      - SRE_DAILY_CAP_DRIVER=2000
      - SRE_NEW_ACCOUNT_PENALTY_DAYS=3
      - SRE_NEW_ACCOUNT_MULTIPLIER=0.5
      - SRE_IDEMPOTENCY_TTL_DAYS=7
      - SRE_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/v1/ready').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Worker (Redis Streams Consumer) ──────────────────────
  # docker compose --profile backend up
  worker:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: saigon_worker
    profiles: [backend]
    command: ["python", "-m", "app.workers"]
    volumes:
      - ./engine:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      # 기본값 금지 — 비어있으면 BFF↔Engine / worker↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - ENGINE_ADMIN_JWT_SECRET=${ENGINE_ADMIN_JWT_SECRET:?ENGINE_ADMIN_JWT_SECRET missing in .env}
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL}
      - SRE_LOG_LEVEL=INFO
    # 프로세스 생존은 Docker가 판단하고 healthcheck는 DB·Redis·migration readiness만 판정한다.
    # 루프 heartbeat는 운영 관측용이며 readiness와 섞지 않는다.
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Noti Worker (알림 이벤트 소비 — noti:events) ──────────
  # docker compose --profile backend up
  # backend(bff) 이미지 재사용 + command 오버라이드. 자동 reload 없음 — 코드 수정 시 재시작 필수.
  noti_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saigon_noti_worker
    profiles: [backend]
    command: ["python", "-m", "app.noti_worker"]
    volumes:
      - ./backend:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - ENGINE_BASE_URL=http://engine:8090
      # 기본값 금지 — 비어있으면 BFF↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - TZ=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    # 워커 루프가 매 iteration 마다 갱신하는 heartbeat(TTL 30s)로 liveness 판정 (engine worker 와 동일 패턴)
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if (redis.Redis.from_url(os.environ['REDIS_URL']).ttl('noti:worker:heartbeat') or 0) > 0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Wiki (Docusaurus — 개발자 문서 포털) ──────────────────────
  # docker compose --profile wiki up --build -d
  wiki:
    build:
      context: ./wiki
      dockerfile: Dockerfile
    container_name: saigon_wiki
    profiles: [wiki]
    networks:
      - dev-net
    restart: unless-stopped

  # ── Redis (Message Queue — Streams) ──────────────────────
  # docker compose --profile backend up
  redis:
    image: redis:7-alpine
    container_name: saigon_redis
    profiles: [backend]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - saigon_redis_data:/data
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Database (PostgreSQL + PostGIS) ───────────────────────
  # docker compose --profile backend up
  database:
    image: postgis/postgis:15-3.3
    container_name: saigon_db
    profiles: [backend]
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - saigon_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dev-net
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
