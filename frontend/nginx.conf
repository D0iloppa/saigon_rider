server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── 압축 (베트남 회선 대응) ────────────────────────────────
    # nginx:alpine 기본 nginx.conf 는 `#gzip on;` (주석) 이라 켜주지 않으면 무압축으로
    # 나간다. 실측: 엔트리 JS 538KB→178KB, vendor-react 165KB→54KB, CSS 68KB→15KB,
    # 동네지도 depth3.json 371KB→122KB.
    # woff2/png/jpg/gif/webp 는 이미 압축된 포맷이라 gzip_types 에 넣지 않는다(CPU 낭비).
    # text/event-stream 도 의도적으로 제외 — 향후 SSE 도입 시 압축 버퍼링으로 인한
    # 이벤트 지연을 막는다.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # 진입 nginx 를 경유해 들어오므로 Via 헤더가 붙는 hop 이 생겨도 압축이 꺼지지 않게 명시
    gzip_proxied any;
    gzip_types
        text/css
        text/javascript
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # SPA 라우팅 — React Router 경로를 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 빌드 결과물(해시 포함 파일명)은 장기 캐시
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 동네지도 정적 지오메트리(depth2/3.json) — 파일명 해싱/버전쿼리 없이 배포 시
    # 같은 경로를 덮어쓰므로 immutable 장기 캐시는 위험(stale 갱신 누락). 대신
    # 짧은 max-age + ETag/Last-Modified(nginx 기본 동작) 재검증으로 콜드 스타트에도
    # 304 응답을 받게 한다. 향후 파일명 해싱/버전쿼리 도입 시 immutable로 전환 검토.
    location ~* ^/maps/v2/.+/depth[0-9]+\.json$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # index.html은 캐시 금지 (배포 시 항상 최신 버전)
    # expires 디렉티브는 Cache-Control: max-age=0 을 추가로 emit해 add_header와
    # 중복/충돌(WKWebView가 max-age=0을 집어 콜드런치 시 stale)을 일으키므로 사용하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
