# 비즈니스 파트너 랜딩 (SGR-312 BP-7) — 정적 서빙
# dev 검증용 전용 포트(host 18092 → 이 블록). 운영은 business.saigon-rider.com
# DNS+TLS 설정 후 이 블록 재사용, letantonsheriff→saigon-rider 마이그레이션 runbook 과
# 조율(SGR-312 §8 L1).
server {
    listen 81;
    server_name business.saigon-rider.com;

    root /etc/nginx/landing;
    index index.html;

    # ── 보안 헤더 (DB-9) ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; object-src 'none';" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
