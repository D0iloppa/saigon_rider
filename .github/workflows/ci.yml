name: CI

on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치의 새 push/PR 업데이트가 오면 이전 실행은 취소 — Actions 분 절약
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-scripts:
    name: pre-commit 가드 스크립트 (seed-safety / migration-prefix / committed-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_production_seed_safety.py
      - run: python3 tools/check_migration_prefixes.py
      - run: python3 tools/check_committed_secrets.py

  backend-tests:
    name: backend pytest
    runs-on: ubuntu-latest
    env:
      # CI 전용 더미 값 — 실제 시크릿 아님. ADMIN_JWT_SECRET 미설정 시
      # backend/app/admin_auth.py 가 import 단계에서 RuntimeError 를 던진다.
      ADMIN_JWT_SECRET: ci-dummy-admin-jwt-secret
      ADMIN_PASS_HASH: ci-dummy-admin-pass-hash
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-mock
      - working-directory: backend
        run: python -m pytest app/tests -q

  engine-tests:
    name: engine pytest
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - working-directory: engine
        run: pip install -r requirements.txt -r requirements-dev.txt
      # engine/app/tests/conftest.py 가 DATABASE_URL·ENGINE_SERVICE_KEY·
      # ENGINE_ADMIN_JWT_SECRET 을 os.environ.setdefault 로 자체 주입 — CI 에서
      # 추가 env 불필요.
      - working-directory: engine
        run: python -m pytest app/tests -q

  frontend-checks:
    name: frontend tsc / eslint / mjs contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc -b
      - working-directory: frontend
        run: npx eslint src/
      - working-directory: frontend
        run: node --test $(find src -name "*.test.mjs")

  # E2E (Playwright): 브라우저 E2E 는 별도 워커가 frontend/e2e/** 에 세팅 중이라
  # 이 워크플로에는 아직 잡을 넣지 않는다. 준비되면 아래 형태로 추가:
  #
  # e2e:
  #   name: playwright e2e
  #   runs-on: ubuntu-latest
  #   needs: [frontend-checks]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #         cache: npm
  #         cache-dependency-path: frontend/package-lock.json
  #     - working-directory: frontend
  #       run: npm ci && npx playwright install --with-deps
  #     - working-directory: frontend
  #       run: npx playwright test
