      - ./database/init/147_admin_accounts_role.sql:/migrations/147_admin_accounts_role.sql:ro
      - ./database/init/148_marketplace_ads_exposure.sql:/migrations/148_marketplace_ads_exposure.sql:ro
      - ./database/init/149_ads_tiers.sql:/migrations/149_ads_tiers.sql:ro
      - ./database/init/150_ad_tier_prices.sql:/migrations/150_ad_tier_prices.sql:ro
      - ./database/init/151_biz_verification.sql:/migrations/151_biz_verification.sql:ro
      - ./database/init/152_business_follow.sql:/migrations/152_business_follow.sql:ro
      - ./database/init/153_ad_events.sql:/migrations/153_ad_events.sql:ro
      - ./database/init/154_ad_daily_stats.sql:/migrations/154_ad_daily_stats.sql:ro
      - ./database/init/155_ad_tier_features.sql:/migrations/155_ad_tier_features.sql:ro
      - ./database/init/156_business_price.sql:/migrations/156_business_price.sql:ro
      - ./database/init/157_flood_hotspot_seed_expand.sql:/migrations/157_flood_hotspot_seed_expand.sql:ro
      - ./database/init/158_flood_risk_daily_stale_flag.sql:/migrations/158_flood_risk_daily_stale_flag.sql:ro
      - ./database/init/159_wards_seed.sql:/migrations/159_wards_seed.sql:ro
      - ./database/init/161_contents_is_private_flag.sql:/migrations/161_contents_is_private_flag.sql:ro
      - ./database/init/162_marketplace_listing_withdrawn_status.sql:/migrations/162_marketplace_listing_withdrawn_status.sql:ro
      - ./database/init/163_user_consent_capture.sql:/migrations/163_user_consent_capture.sql:ro
      - ./database/init/164_search_blob.sql:/migrations/164_search_blob.sql:ro
      - ./database/init/165_business_profile_intro.sql:/migrations/165_business_profile_intro.sql:ro
      - ./database/init/166_flood_prediction_status.sql:/migrations/166_flood_prediction_status.sql:ro
      - ./database/init/167_reports_content_detach.sql:/migrations/167_reports_content_detach.sql:ro
      - ./database/init/168_business_profile_owner_nullable.sql:/migrations/168_business_profile_owner_nullable.sql:ro
      - ./database/init/169_schema_parity_backfill.sql:/migrations/169_schema_parity_backfill.sql:ro
      - ./database/init/170_withdrawn_member_archive.sql:/migrations/170_withdrawn_member_archive.sql:ro
