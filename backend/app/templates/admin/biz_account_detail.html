<div class="toolbar">
  <div>
    <a href="/admin/biz-accounts" style="color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;">← 목록으로</a>
    <p class="page-title" style="margin-top:6px;">{{profile_name}}</p>
    <p class="page-sub">신청자: {{applicant}} · 상태: {{profile_status}}</p>
  </div>
</div>

{{flash_html}}

<div class="card" style="margin-bottom:24px;display:flex;gap:24px;">
  <div>{{photo_html}}</div>
  <div style="flex:1;">
    <div class="field"><label class="field-label">업종</label>{{profile_category}}</div>
    <div class="field"><label class="field-label">주소</label>{{profile_address}}</div>
    <div class="field"><label class="field-label">연락처</label>{{profile_phone}}</div>
    <div class="field"><label class="field-label">반려 사유</label>{{reject_reason}}</div>
  </div>
</div>

<h3 style="font-size:14px;font-weight:700;margin-bottom:12px;">보유 광고</h3>
<div class="card" style="margin-bottom:24px;">
  <table class="table">
    <thead><tr><th>제목</th><th>심사 상태</th><th>등록일</th></tr></thead>
    <tbody>{{ads_rows}}</tbody>
  </table>
</div>

{{suspend_html}}

<div class="card">
  <h3 style="font-size:14px;font-weight:700;margin-bottom:12px;">그룹 지정 (브랜드 그룹, admin 전용)</h3>
  <form method="post" action="/admin/biz-accounts/{{profile_id}}/group" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <select name="group_id">
      {{group_options}}
    </select>
    <span style="color:rgba(255,255,255,.35);font-size:12px;">또는 신규 그룹명</span>
    <input type="text" name="new_group_name" placeholder="신규 그룹명">
    <button type="submit" class="btn btn-sm">지정</button>
  </form>
</div>
