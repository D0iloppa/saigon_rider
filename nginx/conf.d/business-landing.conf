# 비즈니스 파트너 랜딩 (SGR-312 BP-7) — 정적 서빙
# dev 검증용 전용 포트(host 18092 → 이 블록). 운영은 business.saigon-rider.com
# DNS+TLS 설정 후 이 블록 재사용, letantonsheriff→saigon-rider 마이그레이션 runbook 과
# 조율(SGR-312 §8 L1).
server {
    listen 81;
    server_name business.saigon-rider.com;

    root /etc/nginx/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
