      - "ON_ERROR_STOP=1"
      - "-f"
      - "/migrations/160_schema_migrations.sql"
      - "-c"
      - "INSERT INTO schema_migrations(version) VALUES (160) ON CONFLICT DO NOTHING;"
      - "-f"
      - "/migrations/139_marketplace_reviews_rating_int.sql"
      - "-c"
      - "INSERT INTO schema_migrations(version) VALUES (139) ON CONFLICT DO NOTHING;"
      - "-f"
      - "/migrations/140_marketplace_trade_integrity.sql"
      - "-c"
      - "INSERT INTO schema_migrations(version) VALUES (140) ON CONFLICT DO NOTHING;"
      - "-f"
      - "/migrations/141_app_versions_active_unique.sql"
      - "-c"
