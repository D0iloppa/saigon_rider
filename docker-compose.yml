      - ./database/init/201_reports_reported_user_guard.sql:/migrations/201_reports_reported_user_guard.sql:ro
      - ./database/init/202_report_public_resolution_summary.sql:/migrations/202_report_public_resolution_summary.sql:ro
      - ./database/init/203_group_conversation.sql:/migrations/203_group_conversation.sql:ro
      - ./database/init/204_community_group.sql:/migrations/204_community_group.sql:ro
      - ./database/init/205_post_hashtags.sql:/migrations/205_post_hashtags.sql:ro
      - ./database/init/206_business_review_hidden_reason_code.sql:/migrations/206_business_review_hidden_reason_code.sql:ro
      - ./database/init/207_notification_settings_group.sql:/migrations/207_notification_settings_group.sql:ro
      - ./database/init/208_user_home_ward.sql:/migrations/208_user_home_ward.sql:ro
      - ./database/init/209_group_message_report.sql:/migrations/209_group_message_report.sql:ro
      - ./database/init/210_dm_voice_message.sql:/migrations/210_dm_voice_message.sql:ro
      - ./database/init/211_marketplace_location_shares.sql:/migrations/211_marketplace_location_shares.sql:ro
      - ./database/init/212_dm_conversation_bans.sql:/migrations/212_dm_conversation_bans.sql:ro
      - ./database/init/214_dm_conversation_merge_direct.sql:/migrations/214_dm_conversation_merge_direct.sql:ro
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - PGHOST=database
      - PGPORT=5432
      - PGDATABASE=${DB_NAME}
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
    restart: "no"

  bff:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saigon_bff
    profiles: [backend]
    # uvicorn --reload 를 .env(UVICORN_RELOAD)로 끌 수 있게 한다. 기본값 1 = 기존 동작(핫리로드) 유지.
    # 끄는 이유: WSL2 의 /mnt/c(drvfs) 마운트가 간헐적으로 os error 5(Input/output error)를 내면
    # watchfiles 워처가 그 예외로 죽고 uvicorn 부모까지 종료돼 BFF 가 크래시 루프에 빠진다
    # (2026-08-03 실제 발생 — 코드는 정상인데 컨테이너만 계속 Exited(1)). 이때 UVICORN_RELOAD= 로
    # 비우면 워처 없이 안정 구동된다. 코드 변경 반영은 docker restart saigon_bff 로 한다.
    # $$ 는 compose 보간을 피해 컨테이너 셸이 확장하게 하는 이스케이프다.
    command: sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port 8080 $${UVICORN_RELOAD:+--reload}"
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./backend:/app
      - ./contents:/data
      - ./frontend/src/components/maps/v2/saigon-depth1.json:/service-area/saigon-depth1.json:ro
      - ./backups:/app/backups
      # 워키토키 모듈(d_modules/WalkieTalkie) 개발 마운트 — PYTHONPATH 로 앞세워 이미지에 설치된
      # git 버전을 가린다(shadow). 모듈을 고치면 uvicorn --reload 가 바로 집어간다.
      # 배포 이미지는 requirements.txt 의 git 의존성이 SoT 이므로, 모듈 변경은 반드시 push 할 것.
      - ./d_modules/WalkieTalkie/packages/server:/opt/walkie_talkie:ro
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      bff_migrate:
        condition: service_completed_successfully
      engine:
        condition: service_healthy
    environment:
      - PYTHONPATH=/opt/walkie_talkie
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      # 게이트9 B-5 정기백업 잡(app/jobs/backup_db.py) 이 pg_dump 로 직접 접속 (bff_migrate 와 동일 관례)
      - PGHOST=database
      - PGPORT=5432
      - PGDATABASE=${DB_NAME}
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      # 오프사이트 암호화 백업 (게이트9 B-5) — 미설정 시 로컬 백업만 수행하고 업로드는 건너뜀 (fail-open)
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ENDPOINT_URL=${BACKUP_S3_ENDPOINT_URL:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - ENGINE_BASE_URL=http://engine:8090
      # 기본값 금지 — 비어있으면 BFF↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - CONTENTS_BASE_PATH=/data
      - IMGPROXY_BASE_URL=${IMGPROXY_BASE_URL}
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      - BFF_PUBLIC_URL=${BFF_PUBLIC_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      - TZ=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      - ADMIN_USER=${ADMIN_USER:-admin}
      # 기본값 금지 — 비어있으면 root 관리자 비밀번호 검증이 무력화되는 사고 방지 (fail-fast)
      - ADMIN_PASS_HASH=${ADMIN_PASS_HASH:?ADMIN_PASS_HASH missing in .env}
      # 기본값 금지 — 공개 문자열로 admin JWT가 서명되면 위조 가능 (fail-fast)
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET missing in .env}
      - WIKI_BASE_PATH=${WIKI_BASE_PATH:-/wiki/}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - RAINVIEWER_API_KEY=${RAINVIEWER_API_KEY:-}
      # 빈 값이면 --reload 없이 구동 (위 command 주석 참조). 기본 1 = 핫리로드 켜짐.
      - UVICORN_RELOAD=${UVICORN_RELOAD-1}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # 자체호스팅 라우팅 엔진(Valhalla). 미설정 시 위 Google Routes API 로 그대로 폴백(W4).
      - ROUTING_ENGINE_URL=${ROUTING_ENGINE_URL:-}
      - TRANSLATE_API_KEY=${TRANSLATE_API_KEY:-}
      - TRANSLATE_PROVIDER=${TRANSLATE_PROVIDER:-google}
      - SMS_PROVIDER_API_KEY=${SMS_PROVIDER_API_KEY:-}
      # Zalo OAuth 인증 호출을 베트남 IP 프록시로 경유 (-501 우회). 미설정 시 직접 호출. CLAUDE.md '## Zalo 인증 프록시 VPS' 참조.
      - ZALO_API_PROXY=${ZALO_API_PROXY:-}
      # F-17/F-18: 신고 접수·미처리 예외 운영자 알림 웹훅. 미설정 시 로그만(무동작).
      - OPS_ALERT_WEBHOOK_URL=${OPS_ALERT_WEBHOOK_URL:-}
      # 탈퇴 식별자 해시 아카이브(170) HMAC pepper. 미설정 시 아카이브만 건너뜀(fail-open, 경보).
      - WITHDRAWN_HASH_PEPPER=${WITHDRAWN_HASH_PEPPER:-}
      # dev/prod 분기 (SMS 스텁·dev-login 노출 제어). prod 는 docker-compose.prod.yml 이 production 으로 고정.
      - APP_ENV=${APP_ENV:-development}
      # 개발 전용 OTP 검증 우회 — APP_ENV 이중게이트. docker-compose.prod.yml 에는 절대 추가하지 말 것.
      - OTP_DEV_BYPASS=${OTP_DEV_BYPASS:-}
      # 개발 전용 — /auth/dev-login-as(지정 계정 OAuth 우회 로그인) 허용 Host. APP_ENV 이중게이트.
      - DEV_HOST=${DEV_HOST:-}
      - OSM_OVERPASS_ENDPOINT=${OSM_OVERPASS_ENDPOINT:-https://overpass-api.de/api/interpreter}
      - WEATHER_CACHE_TTL_CURRENT=${WEATHER_CACHE_TTL_CURRENT:-600}
      - WEATHER_CACHE_TTL_FORECAST_1H=${WEATHER_CACHE_TTL_FORECAST_1H:-1800}
      - WEATHER_CACHE_TTL_FORECAST_24H=${WEATHER_CACHE_TTL_FORECAST_24H:-3600}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_URL=${PLANE_URL:-https://plane.doil.me}
      - PLANE_WORKSPACE=${PLANE_WORKSPACE:-doil}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/ready').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── MCP Dev Server (legacy — Plane으로 대체) ─────────────
  # docker compose --profile legacy up
  mcp_dev:
    build:
      context: ./mcp_dev
      dockerfile: Dockerfile
    container_name: saigon_mcp_dev
    profiles: [backend]
    ports:
      - "${MCP_DEV_PORT:-8095}:8095"
    volumes:
      - ./mcp_dev:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_URL=${PLANE_URL:-https://plane.doil.me}
      - PLANE_WORKSPACE=${PLANE_WORKSPACE:-doil}
      - PLANE_PROJECT_ID=${PLANE_PROJECT_ID:-}
    restart: unless-stopped

  # ── Engine (SRE, 신규) ────────────────────────────────────
  # docker compose --profile backend up
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: saigon_engine
    profiles: [backend]
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8090 --reload"]
    ports:
      - "${ENGINE_PORT:-8090}:8090"
    volumes:
      - ./engine:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      # 기본값 금지 — 비어있으면 BFF↔Engine / worker↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - ENGINE_ADMIN_JWT_SECRET=${ENGINE_ADMIN_JWT_SECRET:?ENGINE_ADMIN_JWT_SECRET missing in .env}
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-/app/firebase-credentials.json}
      - FCM_PUSH_HISTORY_TTL_DAYS=${FCM_PUSH_HISTORY_TTL_DAYS:-7}
      - SRE_TIMEZONE=Asia/Ho_Chi_Minh
      - SRE_RP_EXPIRY_MONTHS=3
      - SRE_DAILY_CAP_STANDARD=250
      - SRE_DAILY_CAP_DRIVER=2000
      - SRE_NEW_ACCOUNT_PENALTY_DAYS=3
      - SRE_NEW_ACCOUNT_MULTIPLIER=0.5
      - SRE_IDEMPOTENCY_TTL_DAYS=7
      - SRE_LOG_LEVEL=INFO
      # F-18: 미처리 예외 운영자 알림 웹훅. 미설정 시 로그만(무동작).
      - OPS_ALERT_WEBHOOK_URL=${OPS_ALERT_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/v1/ready').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Worker (Redis Streams Consumer) ──────────────────────
  # docker compose --profile backend up
  worker:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: saigon_worker
    profiles: [backend]
    command: ["python", "-m", "app.workers"]
    volumes:
      - ./engine:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      # 기본값 금지 — 비어있으면 BFF↔Engine / worker↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - ENGINE_ADMIN_JWT_SECRET=${ENGINE_ADMIN_JWT_SECRET:?ENGINE_ADMIN_JWT_SECRET missing in .env}
      - BFF_INTERNAL_URL=${BFF_INTERNAL_URL}
      - SRE_LOG_LEVEL=INFO
    # 프로세스 생존은 Docker가 판단하고 healthcheck는 DB·Redis·migration readiness만 판정한다.
    # 루프 heartbeat는 운영 관측용이며 readiness와 섞지 않는다.
    healthcheck:
      test: ["CMD", "python", "-m", "app.readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Noti Worker (알림 이벤트 소비 — noti:events) ──────────
  # docker compose --profile backend up
  # backend(bff) 이미지 재사용 + command 오버라이드. 자동 reload 없음 — 코드 수정 시 재시작 필수.
  noti_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saigon_noti_worker
    profiles: [backend]
    command: ["python", "-m", "app.noti_worker"]
    volumes:
      - ./backend:/app
    networks:
      - dev-net
    depends_on:
      database:
        condition: service_healthy
      bff_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - ENGINE_BASE_URL=http://engine:8090
      # 기본값 금지 — 비어있으면 BFF↔Engine 서비스 인증이 무력화(bypass)되는 사고 방지 (fail-fast)
      - ENGINE_SERVICE_KEY=${ENGINE_SERVICE_KEY:?ENGINE_SERVICE_KEY missing in .env}
      - TZ=${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      # F-17: 신고 접수 운영자 알림 웹훅. 미설정 시 로그만(무동작).
      - OPS_ALERT_WEBHOOK_URL=${OPS_ALERT_WEBHOOK_URL:-}
    # 워커 루프가 매 iteration 마다 갱신하는 heartbeat(TTL 30s)로 liveness 판정 (engine worker 와 동일 패턴)
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if (redis.Redis.from_url(os.environ['REDIS_URL']).ttl('noti:worker:heartbeat') or 0) > 0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ── Wiki (Docusaurus — 개발자 문서 포털) ──────────────────────
  # docker compose --profile wiki up --build -d
  wiki:
    build:
      context: ./wiki
      dockerfile: Dockerfile
    container_name: saigon_wiki
    profiles: [wiki]
    networks:
      - dev-net
    restart: unless-stopped

  # ── Redis (Message Queue — Streams) ──────────────────────
  # docker compose --profile backend up
  redis:
    image: redis:7-alpine
    container_name: saigon_redis
    profiles: [backend]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - saigon_redis_data:/data
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Database (PostgreSQL + PostGIS) ───────────────────────
  # docker compose --profile backend up
  database:
    image: postgis/postgis:15-3.3
    container_name: saigon_db
    profiles: [backend]
    command: ["postgres", "-c", "app.seed_profile=${APP_ENV:-production}"]
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - saigon_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dev-net
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
