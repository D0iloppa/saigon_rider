<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세트 목록 전체 페이지 · 물품 정보/묶음 정보 보내기(아이콘)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#17191c}.phone{width:390px;height:844px;background:#f5f6f8;position:relative;overflow:hidden;display:flex;flex-direction:column}.status{height:44px;padding:14px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;flex:none}.header{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;flex:none}.closeBtn{width:32px;height:32px;border:0;background:none;color:#17191c;flex:none}.headerTitle{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:800}.heading{margin:8px 0 20px;font-size:20px;font-weight:800;line-height:1.4}.thumbArea{position:relative}.editBtn{border:0;background:none;color:#ff7a1a;font-size:14px;font-weight:800;padding:6px 4px;flex:none}.body{flex:1;overflow:hidden;padding:8px 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cell{display:flex;flex-direction:column;gap:6px}.cellThumb{width:100%;aspect-ratio:1;border-radius:12px}.cellThumb.a{background:#ffd5ba}.cellThumb.b{background:#c9e6d8}.cellTitle{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cellPrice{font-size:14px;font-weight:800}.cellBadge{font-size:11px;font-weight:700;color:#676c73}.cellBadge.reserved{color:#bd560c}.sendIcon{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;border:0;background:white;box-shadow:0 1px 4px rgba(11,13,20,.2);color:#3c4147;display:flex;align-items:center;justify-content:center}.footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 24px;border-top:1px solid #eceef1;background:white}.summary{font-size:13px;font-weight:700;color:#676c73}.bundleSendIcon{width:40px;height:40px;border-radius:50%;border:0;background:#ff7a1a;color:white;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body><div class="phone">
  <div class="status"><span>14:32</span><span>5G&nbsp;&nbsp;92%</span></div>
  <div class="header">
    <button class="closeBtn" type="button">✕</button>
    <div class="headerTitle">거래 물품</div>
    <button class="editBtn" type="button">물품편집</button>
  </div>
  <div class="body">
    <h2 class="heading">Minh Tuấn님과<br>한 번에 거래하는 물품이에요</h2>
    <div class="grid">
      <div class="cell">
        <div class="thumbArea"><span class="cellThumb a" style="display:block"></span><button class="sendIcon" type="button" aria-label="물품 정보 보내기">➤</button></div>
        <span class="cellTitle">Honda Vision 2021</span>
        <span class="cellPrice">3.000.000 đ</span>
        <span class="cellBadge">판매중</span>
      </div>
      <div class="cell">
        <div class="thumbArea"><span class="cellThumb b" style="display:block"></span><button class="sendIcon" type="button" aria-label="물품 정보 보내기">➤</button></div>
        <span class="cellTitle">오토바이 헬멧</span>
        <span class="cellPrice">100.000 đ</span>
        <span class="cellBadge reserved">예약중</span>
      </div>
    </div>
  </div>
  <div class="footer">
    <span class="summary">2개 · 총 3.100.000 đ</span>
    <button class="bundleSendIcon" type="button" aria-label="묶음 정보 보내기">➤</button>
  </div>
</div></body></html>
