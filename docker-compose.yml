    volumes:
      - ./database/init/160_schema_migrations.sql:/migrations/160_schema_migrations.sql:ro
      - ./database/init/139_marketplace_reviews_rating_int.sql:/migrations/139_marketplace_reviews_rating_int.sql:ro
      - ./database/init/140_marketplace_trade_integrity.sql:/migrations/140_marketplace_trade_integrity.sql:ro
      - ./database/init/141_app_versions_active_unique.sql:/migrations/141_app_versions_active_unique.sql:ro
      - ./database/init/142_notifications_support_type.sql:/migrations/142_notifications_support_type.sql:ro
      - ./database/init/143_marketplace_biz_poi_geom.sql:/migrations/143_marketplace_biz_poi_geom.sql:ro
      - ./database/init/144_reports_feed.sql:/migrations/144_reports_feed.sql:ro
      - ./database/init/145_notifications_event_idempotency.sql:/migrations/145_notifications_event_idempotency.sql:ro
