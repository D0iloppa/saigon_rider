# =============================================================
# Saigon Rider — 호스트 nginx 라우팅 (saigon-rider.com)
# 설치: sudo cp deploy/saigon-rider.conf /etc/nginx/conf.d/saigon-rider.conf
#
# root+www+business(saigon-rider.com) : 출시 랜딩페이지 정적 서빙 (/var/www/saigon-rider)
#   같은 정적 빌드(하나의 dist)를 공유 — business.saigon-rider.com 은 React 쪽에서
#   hostname 을 읽어 비즈니스 전용 페이지를 렌더링한다 (apps/client/src/App.tsx 참조).
# app.saigon-rider.com       : 컨테이너 nginx(127.0.0.1:18090)로 라우팅 (기존 앱, www 에서 이동)
# 인증서: certbot nginx 플러그인(HTTP-01)으로 발급한 saigon-rider.com cert
#         (SAN 에 root+www+app+business 포함, --expand 로 추가). 갱신은 deploy/renew-certs.sh + cron.
# 주의: 본 conf 의 443 블록은 인증서가 존재해야 nginx -t 통과 →
#       반드시 certbot 발급/expand(certonly --nginx) 이후에 설치할 것.
# =============================================================

# HTTP → HTTPS (+ certbot acme-challenge 웹루트 보존: 갱신 폴백용)
server {
    listen 80;
    server_name saigon-rider.com www.saigon-rider.com app.saigon-rider.com business.saigon-rider.com;

    location ^~ /.well-known/acme-challenge/ {
        root /app/nginx/;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 출시 랜딩페이지 — 정적 SPA 직접 서빙 (일반 사용자 + 비즈니스 페이지 공용 빌드)
server {
    # http2: 베트남 회선(높은 RTT) 대응 — HTTP/1.1 의 도메인당 6커넥션 제한·헤더 무압축을
    # 제거해 다중 요청 왕복을 줄인다. dev 엣지(saigon.doil.me)와 동일 표기.
    listen 443 ssl http2;
    server_name saigon-rider.com www.saigon-rider.com business.saigon-rider.com;

    ssl_certificate     /etc/letsencrypt/live/saigon-rider.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saigon-rider.com/privkey.pem;

    root /var/www/saigon-rider;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 앱 — 컨테이너 nginx 로 라우팅 (기존 www 서빙분 이동)
server {
    # http2: 위 랜딩 블록과 동일 이유 (앱은 홈 진입 시 API 9개 + 이미지 다수가 동시에 뜬다)
    listen 443 ssl http2;
    server_name app.saigon-rider.com;

    ssl_certificate     /etc/letsencrypt/live/saigon-rider.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saigon-rider.com/privkey.pem;

    # 컨테이너 nginx 와 동일 (업로드 413 방지)
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # https 스킴 전달
        proxy_http_version 1.1;
        proxy_set_header Connection "";                # upstream keepalive
        proxy_buffering off;                           # SSE/스트리밍(가챠) 지연 방지
        proxy_read_timeout 300s;
    }
}
