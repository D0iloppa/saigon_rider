<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DM 방 안 전용 진행 중 세션 바</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#17191c}.phone{width:390px;height:844px;background:#f7f8fa;position:relative;overflow:hidden}.status{height:44px;padding:14px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;background:white}.header{height:62px;background:white;border-bottom:1px solid #eceef1;display:flex;align-items:center;gap:12px;padding:0 16px}.back{font-size:28px}.avatar{width:38px;height:38px;border-radius:50%;background:#ffd5ba;display:grid;place-items:center;font-weight:800;color:#9a4b13}.who{flex:1}.name{font-size:16px;font-weight:800}.sub{display:block;font-size:12px;color:#777}.more{font-size:24px}.context{margin:12px 12px 0;padding:12px;border-radius:14px;background:white;border:1px solid #eceef1}.context b{display:block;font-size:14px}.context span{font-size:12px;color:#666}.messages{padding:18px 14px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:76%;padding:10px 12px;border-radius:14px;background:white;border:1px solid #eceef1;font-size:14px}.mine{align-self:flex-end;background:#ff7a1a;color:white;border:0}.time{font-size:10px;color:#999;margin-top:3px}.mine .time{color:#ffe8d8}.session{position:absolute;left:0;right:0;bottom:58px;min-height:64px;background:white;border-top:1px solid #e4e6e9;display:flex;align-items:center;padding:8px 10px;gap:8px}.slot{height:46px;border-radius:12px;background:#fff5ed;border:1px solid #ffd8bb;display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0}.walkie{flex:1}.location{width:112px;background:#f2f7ff;border-color:#d7e5ff}.dot{width:8px;height:8px;border-radius:50%;background:#2db36c;flex:none}.ico{font-size:17px}.slotText{min-width:0;flex:1}.slotText b,.slotText small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slotText b{font-size:12px}.slotText small{font-size:10px;color:#676c73}.ptt{border:0;border-radius:999px;background:#ff7a1a;color:white;height:30px;padding:0 10px;font-size:11px;font-weight:800}.close{border:0;background:transparent;font-size:20px;color:#555;padding:7px}.composer{position:absolute;left:0;right:0;bottom:0;height:58px;background:white;border-top:1px solid #e8eaed;display:flex;align-items:center;gap:8px;padding:8px 12px}.plus{font-size:24px;color:#555}.input{flex:1;height:40px;border-radius:20px;background:#f1f2f4;color:#8a8e94;padding:11px 14px;font-size:13px}.send{font-size:13px;color:#ff7a1a;font-weight:800}.note{position:absolute;top:122px;right:12px;padding:5px 9px;border-radius:999px;background:#17191c;color:white;font-size:10px;font-weight:700}
</style>
</head>
<body><div class="phone">
  <div class="status"><span>14:32</span><span>5G&nbsp;&nbsp;92%</span></div>
  <div class="header"><span class="back">‹</span><span class="avatar">M</span><span class="who"><span class="name">Minh Tuấn</span><span class="sub">Vision 거래 대화</span></span><span class="more">⋯</span></div>
  <span class="note">현재 DM 방에서만 표시</span>
  <div class="context"><b>Honda Vision 2021 · 약속 확정</b><span>오늘 15:00 · Cà phê Chuyện 앞</span></div>
  <div class="messages"><div class="bubble">지금 출발할게요<div class="time">14:31</div></div><div class="bubble mine">네, 위치 공유 켜둘게요<div class="time">14:32</div></div></div>
  <div class="session"><div class="slot walkie"><span class="dot"></span><span class="ico">◉</span><span class="slotText"><b>무전기</b><small>상대 접속 중</small></span><button class="ptt">말하기</button></div><div class="slot location"><span class="ico">⌖</span><span class="slotText"><b>위치공유</b><small>2명 참여</small></span></div><button class="close" aria-label="세션 종료">×</button></div>
  <div class="composer"><span class="plus">＋</span><span class="input">메시지 보내기</span><span class="send">전송</span></div>
</div></body></html>
