networks:
  dev-net:
    driver: bridge
    name: ${NETWORK_BRIDGE}
  # 상위 hop 게이트웨이(doil-gw)와의 직결 브리지. 멤버는 doil-gw / saigon_nginx 둘뿐이다.
  # doil-gw 가 예전처럼 host.docker.internal:18090 헤어핀으로 붙으면 Docker Desktop
  # 포워더가 부하 시 RST 를 뱉어 상시 ~8% 502 가 났다. 양쪽 compose 모두 external 로
  # 선언해 어느 스택도 소유하지 않는다. 최초 생성: docker network create saigon-edge
  saigon-edge:
    external: true

volumes:
  saigon_db_data:
  saigon_redis_data:

services:

  # ── Nginx (Reverse Proxy) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: saigon_nginx
    ports:
      - "${NGINX_PORT}:80"
      - "${BIZ_LANDING_PORT}:81"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d:/docker-entrypoint.d:ro
      - ./nginx/pages:/etc/nginx/pages:ro
      - ./dev-test:/srv/dev-test:ro
      - ./landing:/etc/nginx/landing:ro
    networks:
      - dev-net
      - saigon-edge
    depends_on:
      - frontend
      - imgproxy
    environment:
      - WIKI_AUTH_USER=${WIKI_AUTH_USER:-admin}
      # 기본값 금지 — .env 누락 시 공개 비밀번호로 조용히 기동되는 사고 방지 (fail-fast)
      - WIKI_AUTH_PASS=${WIKI_AUTH_PASS:?WIKI_AUTH_PASS missing in .env}
    restart: unless-stopped

  # ── Frontend (React + Vite → nginx 정적 서빙) ────────────
  frontend:
    build:
      # 컨텍스트가 레포 루트인 이유: 워키토키 SDK(d_modules/WalkieTalkie/packages/client)가
      # frontend/ 밖에 있어 컨텍스트를 frontend 로 두면 file: 의존성이 해결되지 않는다.
      # 전송량은 루트 .dockerignore 가 막는다(contents/·routing_data/ 등 1GB+ 제외).
      context: .
      dockerfile: frontend/Dockerfile
    container_name: saigon_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - dev-net
    restart: unless-stopped

  # ── Admin Frontend (React SPA → nginx 정적 서빙) ──────────
  # 포트 미노출 — 진입 nginx 경유(/admin/)로만 접근 (내부 네트워크 전용)
  admin_frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: saigon_admin_frontend
    networks:
      - dev-net
    restart: unless-stopped

  # ── Imgproxy (Image Processing) ───────────────────────────
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: saigon_imgproxy
    volumes:
      - ./contents:/data:ro
    networks:
      - dev-net
    environment:
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/data
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      - IMGPROXY_MAX_SRC_RESOLUTION=50
      - IMGPROXY_ALLOWED_SOURCES=local://
    restart: unless-stopped

  # ── Routing Engine (Valhalla, 자체호스팅 — Google Routes API 과금 제거) ──
  # docker compose --profile backend up
  # BFF 내부 호출 전용 — nginx/외부 미노출(ports 미매핑). 타일은 deploy/build_routing_tiles.sh 로
  # 개발 머신에서 1회 빌드 후 volume 마운트만(운영 컨테이너는 재빌드하지 않음).
  routing_engine:
    image: valhalla/valhalla:run-latest
    container_name: saigon_routing_engine
    profiles: [backend]
    command: ["valhalla_service", "/data/valhalla/valhalla.json", "1"]
    volumes:
      - ./routing_data/valhalla:/data/valhalla:ro
    networks:
      - dev-net
    restart: unless-stopped

  # ── BFF (FastAPI, 기존 backend → 역할 재정의) ───────────────
  # docker compose --profile backend up
  bff_migrate:
    image: postgis/postgis:15-3.3
    container_name: saigon_bff_migrate
    profiles: [backend]
    entrypoint: ["psql"]
    command:
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/migrations/160_schema_migrations.sql"
